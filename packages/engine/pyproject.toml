[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidtwin-engine"
version = "0.1.0"
description = "Terminal graph, hydraulics, routing and validation (no web or DB dependencies)"
requires-python = ">=3.12"
dependencies = ["networkx>=3.2", "ortools>=9.10", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/liquidtwin_engine/schema_models.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
