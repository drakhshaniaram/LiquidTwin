name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "packages/engine[dev]"
      - run: python -m pip install -e "services/api[dev]"
      - run: python -m pytest packages/engine tests/reference services/api
      - run: python -m ruff check packages/engine/src packages/engine/tests services/api/src services/api/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/schema/package-lock.json
      - run: npm install --global npm@11
      - run: npm ci
        working-directory: packages/schema
      - run: npm run schema:check
        working-directory: packages/schema
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - if: ${{ hashFiles('apps/web/tests/e2e/**/*.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ hashFiles('apps/web/tests/e2e/**/*.spec.ts') != '' }}
        run: npm run e2e
        working-directory: apps/web
      - if: ${{ hashFiles('tests/perf/test_*.py') != '' }}
        run: python -m pytest tests/perf -m benchmark
