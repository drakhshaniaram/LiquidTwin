services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liquidtwin}
      POSTGRES_USER: ${POSTGRES_USER:-liquidtwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liquidtwin_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-liquidtwin} -d ${POSTGRES_DB:-liquidtwin}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
